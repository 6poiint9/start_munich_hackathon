name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check lineguard tests
      # Tests that need the customer snapshot skip themselves when it is absent.
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The page exists from step A5 on. Before that, these steps skip.
      - if: ${{ hashFiles('web/package-lock.json') != '' }}
        run: npm ci
        working-directory: web
      - if: ${{ hashFiles('web/package-lock.json') != '' }}
        run: npm run lint
        working-directory: web
      - if: ${{ hashFiles('web/package-lock.json') != '' }}
        run: npm run build
        working-directory: web
